apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: temperature-conversion-service
  labels:
    app: temperature-conversion-service
    # Must match the Prometheus serviceMonitorSelector (Helm release "monitoring")
    release: monitoring
spec:
  selector:
    matchLabels:
      app: temperature-conversion-service
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
