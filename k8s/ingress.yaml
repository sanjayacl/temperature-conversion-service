apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: temperature-conversion-service
  labels:
    app: temperature-conversion-service
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/temperature
            pathType: Prefix
            backend:
              service:
                name: temperature-conversion-service
                port:
                  number: 8081
