apiVersion: v1
kind: Service
metadata:
  name: temperature-conversion-service
  labels:
    app: temperature-conversion-service
spec:
  type: NodePort
  selector:
    app: temperature-conversion-service
  ports:
    - name: http
      port: 80
      targetPort: 8081
      # nodePort: 30081  # optional: pin a specific port (30000-32767); omit to let k8s assign one
